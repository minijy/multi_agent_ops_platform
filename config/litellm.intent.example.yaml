model_list:
  - model_name: intent-router
    litellm_params:
      model: openai/qwen3-1.7b-intent-router
      api_base: http://127.0.0.1:8001/v1
      api_key: os.environ/INTENT_VLLM_API_KEY
      timeout: 3
      max_retries: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

router_settings:
  routing_strategy: least-busy
  # A single local backend should not be put into a long global cooldown after
  # two slow requests; the application already fails open to Coordinator.
  enable_pre_call_checks: false
  allowed_fails: 100
  cooldown_time: 5
