model_list:
  - model_name: intent-router
    litellm_params:
      model: openai/qwen3-1.7b-intent-router
      api_base: http://127.0.0.1:8001/v1
      api_key: os.environ/INTENT_VLLM_API_KEY
      timeout: 3
      max_retries: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

router_settings:
  routing_strategy: least-busy
  redis_host: 127.0.0.1
  redis_port: 6379
  redis_db: 1
  enable_pre_call_checks: true
  allowed_fails: 2
  cooldown_time: 20
