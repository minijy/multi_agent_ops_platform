[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-ops-platform"
version = "0.1.0"
description = "Production-oriented Agent Runtime platform with Amazon Finance"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.7,<3",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langgraph-checkpoint-postgres>=3,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "pymysql>=1.1,<2",
  "langchain-openai>=1.0,<2",
  "zai-sdk>=0.2.3,<1",
  "mcp>=1.29,<2",
  "cryptography==44.0.3",
  "pillow>=12,<13",
  "pyyaml>=6,<7",
  "qdrant-client>=1.12,<2",
  "pymilvus>=2.5,<3",
  "sentence-transformers>=3.4,<4",
  "transformers>=4.41,<4.50",
  "numpy>=1.26,<2",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pyjwt>=2.9,<3",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
ops-agent-api = "ops_agent.api.app:main"
ops-agent-eval = "ops_agent.evals:main"
ops-agent-migrate = "ops_agent.migrations:main"
ops-agent-subagent-worker = "ops_agent.runtime.subagent_worker:main"
ops-agent-install-mock = "ops_agent.install_mock:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ops_agent.evals" = ["golden.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
