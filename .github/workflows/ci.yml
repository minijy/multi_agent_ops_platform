name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Unit and API tests
        run: pytest -q
      - name: Offline eval
        run: python -m ops_agent.evals
      - name: Lint new runtime modules
        run: ruff check src/ops_agent/runtime/observability.py src/ops_agent/runtime/tracing.py src/ops_agent/runtime/auth.py src/ops_agent/evals tests/test_observability.py
