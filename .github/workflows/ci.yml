name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ops_agent_test
          POSTGRES_USER: ops_agent
          POSTGRES_PASSWORD: ops_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ops_agent -d ops_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_DSN: postgresql://ops_agent:ops_agent@127.0.0.1:5432/ops_agent_test
      TEST_POSTGRES_DSN: postgresql://ops_agent:ops_agent@127.0.0.1:5432/ops_agent_test
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Unit and API tests
        run: pytest -q
      - name: Offline eval
        run: python -m ops_agent.evals
      - name: Lint new runtime modules
        run: ruff check src/ops_agent/runtime/observability.py src/ops_agent/runtime/tracing.py src/ops_agent/runtime/auth.py src/ops_agent/evals tests/test_observability.py
